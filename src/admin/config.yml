backend:
  name: github
  repo: furlapie/Minerals
  branch: main
  base_url: https://api.netlify.com

# Allows you to edit the CMS locally without logging in
local_backend: true

# Your custom logo for the login screen and header
logo_url: https://your-site.netlify.app/images/logo.svg # Replace with your actual logo URL

media_folder: "src/images" # Where uploaded images go
public_folder: "/images"   # How they're referenced in the site

collections:
  - name: "specimens"
    label: "Specimen Collection"
    label_singular: "Specimen"
    file: "src/_data/specimens.json" # Path to your JSON file
    identifier_field: "slug" # The unique field for each specimen
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Shelf", name: "shelf", widget: "number", value_type: "int" }
      - { label: "Box", name: "box", widget: "number", value_type: "int" }
      - { label: "Number", name: "number", widget: "number", value_type: "int" }
      - { label: "Colors", name: "colors", widget: "list", field: { label: "Color (Hex)", name: "color", widget: "string" } }
      - { label: "Shiny", name: "shiny", widget: "boolean", default: false }
      - { label: "Type", name: "type", widget: "select", options: ["Crystal", "Gem", "Rock", "Mineral", "Geode", "Fossil"] }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Main Mineral", name: "main", widget: "string", required: false }
      - { label: "Habit", name: "habit", widget: "string", required: false }
      - { label: "Matrix", name: "matrix", widget: "string", required: false }
      - { label: "From (Who)", name: "from_who", widget: "string", required: false }
      - { label: "Origin (Where)", name: "from_where", widget: "string", required: false }
      - { label: "Date Acquired", name: "date_acquired", widget: "number", value_type: "int", required: false }
      - { label: "Weight (g)", name: "weight_g", widget: "number", value_type: "float", required: false }
      - { label: "Quantity", name: "quantity", widget: "number", value_type: "int", default: 1 }
      - { label: "Price", name: "price", widget: "number", value_type: "float", required: false }
      - { label: "Tier", name: "tier", widget: "number", value_type: "int", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Work in Progress", name: "wip", widget: "boolean", default: false }
      - { label: "Has Specific 3D Model", name: "has_specific", widget: "boolean", default: false }
      # The 'models' array is complex; for now, you can manage it manually in the JSON.
      # Adding a full object-list widget is possible but adds complexity.